<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eSignon 이메일 템플릿 · 한국어 및 다국어 전체 보기</title>
  <style>
    * { box-sizing: border-box; }
    body, table, td, a, button, span, p, div { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',Arial,sans-serif; mso-font-alt:'Malgun Gothic'; }
    table, td { mso-table-lspace:0; mso-table-rspace:0; border-collapse:collapse; }
    img { border:0; height:auto; line-height:100%; outline:none; text-decoration:none; }
    body { margin:0; background:#F9FAFB; color:#191F28; font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,Arial,sans-serif; letter-spacing:-0.24px; }
    button { font:inherit; }

    .template-nav {
      position:fixed; inset:0 auto 0 0; z-index:10; width:232px; padding:24px 16px;
      overflow-y:auto; background:#FFFFFF; border-right:1px solid #E5E8EB;
    }
    .nav-title { margin:0 8px 4px; font-size:18px; line-height:27px; font-weight:700; }
    .nav-summary { margin:0 8px 16px; font-size:12px; line-height:18px; font-weight:500; color:#8B95A1; }
    .nav-legend { display:flex; flex-wrap:wrap; gap:6px 10px; margin:0 8px 20px; }
    .legend-item { display:inline-flex; align-items:center; gap:5px; font-size:11px; line-height:16px; font-weight:600; color:#6B7684; }
    .legend-dot, .nav-dot { display:inline-block; flex:none; width:8px; height:8px; border-radius:9999px; background:#8B95A1; }
    .nav-group { margin:20px 8px 8px; font-size:12px; line-height:18px; font-weight:600; color:#8B95A1; }
    .nav-button {
      display:block; width:100%; min-height:40px; margin:4px 0; padding:9px 12px;
      border:0; border-radius:12px; background:transparent; color:#4E5968;
      font-size:14px; line-height:21px; font-weight:600; text-align:left; cursor:pointer;
    }
    .nav-button .nav-dot { margin-right:8px; }
    .nav-button:hover { background:#F2F4F6; color:#191F28; }
    .tone-informative .nav-dot, .legend-informative { background:#0088FF; }
    .tone-positive .nav-dot, .legend-positive { background:#34C759; }
    .tone-critical .nav-dot, .legend-critical { background:#FF383C; }
    .tone-warning .nav-dot, .legend-warning { background:#FF9500; }
    .tone-neutral .nav-dot, .legend-neutral { background:#8B95A1; }
    .nav-button.tone-informative.is-active { background:#EBF5FF; color:#0062BD; }
    .nav-button.tone-positive.is-active { background:#F2FAF3; color:#269342; }
    .nav-button.tone-critical.is-active { background:#FFF1F1; color:#BD2A2D; }
    .nav-button.tone-warning.is-active { background:#FFF7EB; color:#BD6E00; }
    .nav-button.tone-neutral.is-active { background:#F2F4F6; color:#191F28; }

    .gallery-main { min-height:100vh; margin-left:232px; padding:24px 88px 48px 24px; }
    .preview-toggle {
      position:fixed; top:24px; right:24px; z-index:20; display:inline-flex; align-items:center; gap:10px; height:40px; padding:0 12px;
      border:1px solid #E5E8EB; border-radius:12px; background:#FFFFFF; color:#191F28;
      font-size:14px; line-height:21px; font-weight:600; cursor:pointer;
      box-shadow:0 4px 12px rgba(25,31,40,.18);
    }
    .preview-toggle:hover { background:#F9FAFB; }
    .preview-toggle:focus-visible { outline:2px solid #0088FF; outline-offset:2px; }
    .preview-switch { position:relative; display:inline-block; width:36px; height:20px; border-radius:9999px; background:#B0B8C1; transition:background .2s ease; }
    .preview-switch::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:9999px; background:#FFFFFF; box-shadow:0 1px 2px rgba(25,31,40,.2); transition:transform .2s ease; }
    .preview-toggle[aria-pressed="true"] .preview-switch { background:#0088FF; }
    .preview-toggle[aria-pressed="true"] .preview-switch::after { transform:translateX(16px); }
    .font-preview-control {
      position:fixed; top:72px; right:24px; z-index:20; display:none; align-items:center; gap:8px; min-height:40px; padding:8px 12px;
      border:1px solid #E5E8EB; border-radius:12px; background:#FFFFFF; color:#191F28; box-shadow:0 4px 12px rgba(25,31,40,.18);
      font-size:13px; line-height:20px; font-weight:600;
    }
    .font-preview-control.is-visible { display:flex; }
    .font-preview-control select { min-width:156px; height:32px; padding:0 28px 0 10px; border:1px solid #D1D6DB; border-radius:8px; background:#FFFFFF; color:#191F28; font-size:13px; }
    .email-shell.font-preview-active, .email-shell.font-preview-active * { font-family:var(--preview-font) !important; }
    .preview-sample { display:none; }
    .show-examples .preview-placeholder { display:none; }
    .show-examples .preview-sample { display:inline; }

    .email-shell { width:100%; max-width:600px; margin:0 auto; background:#FFFFFF; }
    .email-shell td { mso-line-height-rule:exactly; }
    .email-content { padding:24px; }
    .hero-title { font-size:28px; line-height:40px; font-weight:700; color:#191F28; word-break:keep-all; overflow-wrap:anywhere; }
    .recipient-line { font-size:16px; line-height:24px; font-weight:400; color:#4E5968; word-break:keep-all; overflow-wrap:anywhere; }
    .brand-description { text-align:left; font-size:14px; line-height:21px; font-weight:600; color:#6B7684; word-break:keep-all; overflow-wrap:anywhere; }
    .email-shell.is-branding #header-logo { text-align:left !important; }
    .brand-logo-box { display:inline-flex; align-items:center; justify-content:flex-start; box-sizing:border-box; width:300px; max-width:100%; height:100px; padding:12px 16px; border:1px dashed #D1D6DB; border-radius:8px; background:#FFFFFF; text-align:left; }
    .brand-logo-placeholder { color:#8B95A1; font-size:13px; line-height:20px; font-weight:400; }
    .brand-logo-placeholder strong { display:block; margin-bottom:2px; color:#6B7684; font-size:14px; line-height:21px; font-weight:500; }
    .brand-logo-sample { display:block; width:auto; max-width:300px; max-height:100px; }
    .show-examples .brand-logo-box { width:auto; max-width:300px; height:auto; min-width:0; padding:0; border-color:transparent; border-style:solid; background:transparent; }
    .show-examples .email-shell.is-branding .cta-button { background:#008C45 !important; color:#FFFFFF !important; }
    .show-examples .email-shell.is-branding .info-table,
    .show-examples .email-shell.is-branding .history-box { border-color:#FFC600 !important; }
    .hero-subtitle { font-size:16px; line-height:24px; font-weight:400; color:#4E5968; }
    .section-title { padding:0 0 8px; font-size:16px; line-height:24px; font-weight:700; color:#191F28; }
    .info-table { width:100%; table-layout:fixed; border:1px solid #E5E8EB; border-radius:12px; border-collapse:separate; border-spacing:0; overflow:hidden; background:#FFFFFF; font-size:14px; line-height:24px; }
    .info-label { box-sizing:border-box; width:112px; max-width:112px; height:48px; padding:0 12px; background:#F9FAFB; border-bottom:1px solid #E5E8EB; font-size:14px; line-height:24px; font-weight:700; color:#191F28; vertical-align:middle; }
    .info-value { box-sizing:border-box; height:48px; padding:0 12px; border-bottom:1px solid #E5E8EB; line-height:24px; font-weight:400; color:#191F28; vertical-align:middle; word-break:break-word; overflow-wrap:anywhere; }
    .info-table tr:last-child .info-label, .info-table tr:last-child .info-value { border-bottom:0; }
    .info-table.is-rounded-card { border:1px solid #E5E8EB; border-radius:12px; border-collapse:separate; border-spacing:0; overflow:hidden; background:#FFFFFF; }
    .info-table.is-complete-card .info-label { width:112px; max-width:112px; height:48px; padding:0 12px; background:#F9FAFB; font-size:14px; line-height:24px; font-weight:700; color:#191F28; text-align:left; }
    .info-table.is-complete-card .info-value { padding:0 12px; }
    .extra-block { padding-top:16px; }
    .extra-title { padding-bottom:8px; font-size:16px; line-height:24px; font-weight:700; color:#191F28; }
    .history-box { padding:0; background:#FFFFFF; border:1px solid #E5E8EB; border-radius:12px; overflow:hidden; font-size:14px; line-height:21px; color:#4E5968; }
    .recipient-table { width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; background:#FFFFFF; }
    .recipient-table > thead > tr > th { box-sizing:border-box; height:48px; padding:0 12px; border-bottom:1px solid #E5E8EB; background:#F9FAFB; font-size:14px; line-height:24px; font-weight:700; color:#191F28; text-align:left; vertical-align:middle; }
    .recipient-table > tbody > tr > td { box-sizing:border-box; height:48px; padding:0 12px; border-bottom:1px solid #F2F4F6; font-size:14px; line-height:24px; color:#191F28; text-align:left; vertical-align:middle; overflow-wrap:anywhere; word-break:break-word; }
    .recipient-table > tbody > tr:last-child > td { border-bottom:0; }
    .recipient-table .recipient-order { box-sizing:border-box; width:56px; max-width:56px; padding:0; text-align:center; white-space:nowrap; word-break:keep-all; overflow-wrap:normal; }
    .recipient-table .recipient-name { width:138px; }
    .recipient-table .recipient-status { box-sizing:content-box; width:64px; max-width:64px; padding:0 12px; text-align:left; white-space:nowrap; }
    .email-shell.is-international .recipient-table .recipient-name { width:176px; }
    .email-shell.is-international .recipient-table .recipient-status { width:64px; max-width:64px; white-space:normal; word-break:keep-all; overflow-wrap:normal; }
    .recipient-table td.recipient-order { color:#6B7684; text-align:center; }
    .recipient-table td.recipient-name,
    .recipient-table td.recipient-contact { color:#191F28; font-weight:400; }
    .recipient-table td.recipient-status { color:#4E5968; font-weight:400; }
    .recipient-name-mobile-label { display:none; }
    .recipient-contact-mobile { display:none; width:100%; border:0; border-collapse:collapse; mso-hide:all; }
    .recipient-contact-mobile td { box-sizing:content-box !important; height:auto !important; min-height:0 !important; padding:2px 0 0 !important; border:0 !important; color:#6B7684 !important; font-size:14px !important; line-height:24px !important; font-weight:400 !important; vertical-align:top !important; word-break:break-all !important; overflow-wrap:anywhere !important; }
    a[x-apple-data-detectors], a[href^="tel:"], a[href^="mailto:"] { color:inherit !important; text-decoration:none !important; }
    .warning-box { padding:14px; background:#FFF1F1; border-radius:12px; color:#E63236; }
    .warning-title { font-size:16px; line-height:24px; font-weight:700; }
    .warning-text { margin-top:4px; font-size:14px; line-height:21px; font-weight:400; color:#4E5968; }
    .warning-emphasis { font-weight:700; color:#E63236; }
    .cta-wrap { padding-top:16px; }
    .cta-table { width:100%; table-layout:fixed; }
    .cta-button { display:block; box-sizing:border-box; width:100%; padding:16px 20px; border-radius:16px; background:#0088FF; color:#FFFFFF; font-size:16px; line-height:24px; font-weight:600; text-align:center; text-decoration:none; }
    .cta-gap { width:8px; }
    .section-divider { height:16px; border-bottom:1px solid #E5E8EB; }
    .security { padding-top:12px; color:#6B7684; }
    .security-title { font-size:14px; line-height:24px; font-weight:600; }
    .security-text { padding-top:4px; font-size:14px; line-height:21px; font-weight:400; }
    .security-gap { height:16px; }
    .legal-text { font-size:14px; line-height:21px; font-weight:400; color:#B0B8C1; }
    .footer-divider { height:16px; border-bottom:1px solid #E5E8EB; }
    .footer { padding-top:16px; color:#B0B8C1; }
    .footer-copy { padding-top:8px; font-size:12px; line-height:18px; font-weight:400; }
    .footer-copy a { color:#0088FF; }
    .copyright { padding-top:16px; font-size:12px; line-height:18px; font-weight:400; }

    @media (max-width:900px) {
      .template-nav { width:184px; }
      .gallery-main { margin-left:184px; padding-right:24px; }
      .preview-toggle { position:fixed; top:auto; bottom:16px; right:16px; }
      .font-preview-control { top:auto; right:16px; bottom:64px; }
    }
    @media (max-width:680px) {
      .template-nav { position:static; width:100%; max-height:none; border-right:0; border-bottom:1px solid #E5E8EB; }
      .gallery-main { margin-left:0; padding:16px; }
      .email-content { padding:16px; }
      .info-label { width:96px !important; max-width:96px !important; height:48px !important; font-size:14px !important; line-height:24px !important; }
      .info-table.is-complete-card .info-label { width:96px !important; max-width:96px !important; height:48px !important; font-size:14px !important; line-height:24px !important; }
      .recipient-table .recipient-order { width:56px !important; max-width:56px !important; padding:0 !important; text-align:center !important; white-space:nowrap !important; word-break:keep-all !important; }
      .recipient-table td.recipient-order { text-align:center !important; }
      .recipient-table .recipient-name { width:auto !important; }
      .recipient-name-desktop-label { display:none !important; }
      .recipient-name-mobile-label { display:inline !important; }
      .recipient-table .recipient-status { box-sizing:content-box !important; width:64px !important; max-width:64px !important; padding:0 0 0 12px !important; white-space:normal !important; word-break:keep-all !important; }
      .recipient-table .recipient-contact-desktop { display:none !important; width:0 !important; max-width:0 !important; overflow:hidden !important; }
      .recipient-contact-mobile { display:table !important; width:100% !important; max-height:none !important; overflow:visible !important; mso-hide:all !important; }
      .cta-table, .cta-table tbody, .cta-table tr, .cta-table td { display:block !important; box-sizing:border-box !important; width:100% !important; max-width:100% !important; }
      .cta-button { display:block !important; box-sizing:border-box !important; width:100% !important; max-width:100% !important; }
      .cta-gap { height:8px; }
    }
    @media print { .template-nav, .preview-toggle, .font-preview-control { display:none !important; } .gallery-main { margin:0; padding:0; } }
  </style>
  <!--[if mso]>
  <style type="text/css">
    body, table, td, a, span, p, div { font-family:'Pretendard','Noto Sans KR','Malgun Gothic','맑은 고딕',Arial,sans-serif !important; mso-font-alt:'Malgun Gothic' !important; }
  </style>
  <![endif]-->
</head>
<body>
  <aside class="template-nav" aria-label="이메일 템플릿 목록">
    <h1 class="nav-title">이메일 템플릿</h1>
    <p class="nav-summary">한국어 33 · English 33 · 日本語 33 · ไทย 33 · 中文 1</p>
    <div class="nav-legend" aria-label="상태 색상 범례">
      <span class="legend-item"><span class="legend-dot legend-informative"></span>진행·요청</span>
      <span class="legend-item"><span class="legend-dot legend-positive"></span>완료</span>
      <span class="legend-item"><span class="legend-dot legend-critical"></span>취소·반려</span>
      <span class="legend-item"><span class="legend-dot legend-warning"></span>경고</span>
      <span class="legend-item"><span class="legend-dot legend-neutral"></span>일반</span>
    </div>
    <div id="template-nav-list"></div>
  </aside>

  <button id="preview-toggle" class="preview-toggle" type="button" role="switch" aria-checked="false" aria-pressed="false">
    <span>예시 데이터</span>
    <span class="preview-switch" aria-hidden="true"></span>
  </button>

  <label id="font-preview-control" class="font-preview-control">
    <span>작성 완료 폰트</span>
    <select id="font-preview-select" aria-label="작성 완료 폰트 폴백 비교">
      <option value="stack">실제 폴백 스택</option>
      <option value="pretendard">Pretendard</option>
      <option value="noto">Noto Sans KR</option>
      <option value="apple">Apple SD Gothic Neo</option>
      <option value="malgun">맑은 고딕</option>
      <option value="arial">Arial</option>
    </select>
  </label>

  <main class="gallery-main">
    <table role="presentation" class="email-shell" border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td class="email-content" style="font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',Arial,sans-serif; mso-font-alt:'Malgun Gothic';">
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
            <tr>
              <td id="header-logo" align="left" style="text-align:left;"></td>
            </tr>
            <tr id="header-logo-gap"><td id="header-logo-gap-cell" height="16" style="height:16px; font-size:0; line-height:16px; mso-line-height-rule:exactly;">&nbsp;</td></tr>
            <tr id="brand-description-row"><td id="brand-description" class="brand-description" align="left" style="text-align:left;"></td></tr>
            <tr id="brand-description-gap"><td height="24" style="height:24px; font-size:0; line-height:24px; mso-line-height-rule:exactly;">&nbsp;</td></tr>
            <tr id="recipient-row"><td id="recipient-line" class="recipient-line"></td></tr>
            <tr id="recipient-gap"><td height="8" style="height:8px; font-size:0; line-height:8px; mso-line-height-rule:exactly;">&nbsp;</td></tr>
            <tr><td id="hero-title" class="hero-title"></td></tr>
            <tr><td height="8" style="height:8px; font-size:0; line-height:8px; mso-line-height-rule:exactly;">&nbsp;</td></tr>
            <tr><td id="hero-subtitle" class="hero-subtitle"></td></tr>
            <tr><td height="16" style="height:16px; font-size:0; line-height:16px; mso-line-height-rule:exactly;">&nbsp;</td></tr>
            <tr><td id="section-title" class="section-title"></td></tr>
            <tr><td><table id="info-table" class="info-table is-rounded-card" role="presentation" border="0" cellpadding="0" cellspacing="0"><tbody id="info-body"></tbody></table></td></tr>
            <tr id="extra-row"><td id="extra-content" class="extra-block"></td></tr>
            <tr id="cta-row"><td class="cta-wrap"><table class="cta-table" role="presentation" border="0" cellpadding="0" cellspacing="0"><tr id="cta-buttons"></tr></table></td></tr>
            <tr id="section-divider-row"><td class="section-divider" height="16" style="height:16px; font-size:0; line-height:16px; mso-line-height-rule:exactly;">&nbsp;</td></tr>
            <tr><td id="security-content" class="security"></td></tr>
            <tr><td class="footer-divider" height="16" style="height:16px; font-size:0; line-height:16px; mso-line-height-rule:exactly;">&nbsp;</td></tr>
            <tr><td id="footer-content" class="footer"></td></tr>
          </table>
        </td>
      </tr>
    </table>
  </main>

  <script>
    const token = (name, sample) => `<span class="preview-placeholder">{${name}}</span><span class="preview-sample">${sample}</span>`;
    const row = (label, name, sample) => ({ label, value: token(name, sample) });
    const commonDocument = '[테스트] 이메일 템플릿 확인용 더미 문서';
    const recipientColumns = {
      ko:['순서','이름','연락처','상태'],
      en:['No.','Name','Contact','Status'],
      ja:['順番','名前','連絡先','ステータス'],
      th:['ลำดับ','ชื่อ','ข้อมูลติดต่อ','สถานะ'],
      'zh-CN':['顺序','姓名','联系方式','状态']
    };
    const recipientList = (recipients,lang='ko') => {
      const columns = recipientColumns[lang] || recipientColumns.en;
      return `<table class="recipient-table"><thead><tr><th class="recipient-order" scope="col">${columns[0]}</th><th class="recipient-name has-mobile-label" scope="col"><b class="recipient-name-desktop-label" style="font-weight:inherit;">${columns[1]}</b><b class="recipient-name-mobile-label" style="font-weight:inherit;">${columns[1]}/${columns[2]}</b></th><th class="recipient-contact recipient-contact-desktop" scope="col">${columns[2]}</th><th class="recipient-status" scope="col">${columns[3]}</th></tr></thead><tbody>${recipients.map((recipient,index) => `<tr><td class="recipient-order">${index + 1}</td><td class="recipient-name">${recipient.name}<table role="presentation" class="recipient-contact-mobile" border="0" cellpadding="0" cellspacing="0" width="100%" style="display:none; width:100%; max-height:0; overflow:hidden; mso-hide:all;"><tr><td style="padding:2px 0 0; border:0; color:#6B7684; font-size:14px; line-height:24px; font-weight:400; word-break:break-all; overflow-wrap:anywhere;">${recipient.contact}</td></tr></table></td><td class="recipient-contact recipient-contact-desktop">${recipient.contact}</td><td class="recipient-status">${recipient.status}</td></tr>`).join('')}</tbody></table>`;
    };
    const commonRecipients = recipientList([
      {name:'예시 수신인 A',contact:'signer-a@example.com',status:'서명 완료'},
      {name:'주식회사 예시 파트너 기업',contact:'reviewer@example.com',status:'검토 완료'},
      {name:'예시 수신인 C',contact:'viewer@example.com',status:'열람 완료'}
    ]);

    const companyTemplates = [
      {
        id:'start-workflow', group:'문서·서명 워크플로', label:'1. 서명 요청', recipient:true,

    function renderNavigation() {
      let currentGroup = '';
      const html = templates.map(item => {
        const group = item.group !== currentGroup ? `<div class="nav-group">${item.group}</div>` : '';
        currentGroup = item.group;
        const tone = templateTones[item.baseId || item.id] || 'neutral';
        return `${group}<button class="nav-button tone-${tone}" type="button" data-id="${item.id}"><span class="nav-dot" aria-hidden="true"></span>${item.label}</button>`;
      }).join('');
      document.getElementById('template-nav-list').innerHTML = html;
      document.querySelectorAll('.nav-button').forEach(button => button.addEventListener('click', () => renderTemplate(button.dataset.id)));
    }

    const previewToggle = document.getElementById('preview-toggle');
    previewToggle.addEventListener('click', () => {
      const isActive = !document.body.classList.contains('show-examples');
      document.body.classList.toggle('show-examples', isActive);
      previewToggle.setAttribute('aria-checked', String(isActive));
      previewToggle.setAttribute('aria-pressed', String(isActive));
    });

      malgun:"'Malgun Gothic','맑은 고딕',sans-serif",
      arial:"Arial,sans-serif"
    };
    const fontPreviewSelect = document.getElementById('font-preview-select');
    fontPreviewSelect.addEventListener('change', () => {
      document.querySelector('.email-shell').style.setProperty('--preview-font', fontPreviewStacks[fontPreviewSelect.value]);
    });
    document.querySelector('.email-shell').style.setProperty('--preview-font', fontPreviewStacks.stack);

    renderNavigation();
    renderTemplate('start-workflow');
  </script>
</body>
